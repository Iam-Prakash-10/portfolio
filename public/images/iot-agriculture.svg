<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070f12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#iotBg)" />

  <!-- Embedded Circuit Grid Overlay -->
  <g stroke="rgba(16,185,129,0.2)" stroke-width="1.5">
    <path d="M 120 180 H 220 V 260 H 340" fill="none" />
    <path d="M 120 280 H 260 V 220 H 340" fill="none" />
    <circle cx="120" cy="180" r="4" fill="#10b981" />
    <circle cx="120" cy="280" r="4" fill="#10b981" />
    <circle cx="340" cy="240" r="6" fill="#06b6d4" />
  </g>

  <!-- ESP32 / Gateway Node -->
  <rect x="280" y="190" width="120" height="100" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="2" />
  <rect x="300" y="210" width="80" height="40" rx="4" fill="#1e293b" />
  <text x="315" y="235" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">ESP32</text>
  <text x="305" y="275" font-family="monospace" font-size="10" fill="#94a3b8">MQTT Gateway</text>

  <!-- Live Telemetry Card -->
  <rect x="470" y="110" width="240" height="220" rx="14" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <text x="495" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">FIELD SENSOR READINGS</text>

  <text x="495" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">Soil Moisture</text>
  <text x="640" y="175" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">64.2% (Optimal)</text>

  <text x="495" y="210" font-family="sans-serif" font-size="11" fill="#94a3b8">Ambient Temp</text>
  <text x="640" y="210" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">26.8 °C</text>

  <text x="495" y="245" font-family="sans-serif" font-size="11" fill="#94a3b8">NPK Nitrogen</text>
  <text x="640" y="245" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">42 mg/kg</text>

  <text x="495" y="280" font-family="sans-serif" font-size="11" fill="#94a3b8">Water Valve</text>
  <rect x="630" y="265" width="60" height="20" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" />
  <text x="645" y="279" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">AUTO</text>

  <!-- Title Bottom -->
  <text x="100" y="440" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">AgriSense Smart IoT Telemetry</text>
  <text x="100" y="465" font-family="sans-serif" font-size="14" fill="#6ee7b7">Embedded Sensor Array, Real-time MQTT Broker & Automated Irrigation Dashboard</text>
</svg>
