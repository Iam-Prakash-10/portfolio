    <circle cx="100" cy="280" r="1.5" /><circle cx="150" cy="280" r="1.5" /><circle cx="200" cy="280" r="1.5" /><circle cx="250" cy="280" r="1.5" /><circle cx="300" cy="280" r="1.5" /><circle cx="350" cy="280" r="1.5" /><circle cx="400" cy="280" r="1.5" /><circle cx="450" cy="280" r="1.5" /><circle cx="500" cy="280" r="1.5" /><circle cx="550" cy="280" r="1.5" /><circle cx="600" cy="280" r="1.5" /><circle cx="650" cy="280" r="1.5" /><circle cx="700" cy="280" r="1.5" />
