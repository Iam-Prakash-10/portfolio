<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trafficBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#172554;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#trafficBg)" />

  <!-- Road grid lines -->
  <path d="M 300 100 L 100 400" stroke="#334155" stroke-width="3" stroke-dasharray="10 10" />
  <path d="M 400 100 L 400 400" stroke="#38bdf8" stroke-width="4" stroke-dasharray="15 15" opacity="0.6" />
  <path d="M 500 100 L 700 400" stroke="#334155" stroke-width="3" stroke-dasharray="10 10" />

  <!-- Bounding boxes (YOLO simulation) -->
  <g>
    <rect x="220" y="240" width="110" height="85" rx="6" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="2" />
    <rect x="220" y="222" width="75" height="18" fill="#06b6d4" rx="3" />
    <text x="226" y="235" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">Car 98.4%</text>

    <!-- Velocity vector -->
    <line x1="275" y1="282" x2="275" y2="340" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
    <circle cx="275" cy="282" r="3" fill="#10b981" />
  </g>

  <g>
    <rect x="420" y="160" width="90" height="70" rx="6" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="2" />
    <rect x="420" y="142" width="80" height="18" fill="#8b5cf6" rx="3" />
    <text x="426" y="155" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">Truck 94.1%</text>
  </g>

  <!-- Telemetry HUD Card -->
  <rect x="520" y="90" width="220" height="180" rx="14" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="540" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">LIVE TRAFFIC METRICS</text>
  <text x="540" y="145" font-family="monospace" font-size="11" fill="#38bdf8">Flow Rate: 42 veh/min</text>
  <text x="540" y="170" font-family="monospace" font-size="11" fill="#10b981">Avg Speed: 48.5 km/h</text>
  <text x="540" y="195" font-family="monospace" font-size="11" fill="#f59e0b">Congestion: Low (14%)</text>
  <text x="540" y="220" font-family="monospace" font-size="11" fill="#a855f7">Inference: 14.2ms (Edge)</text>

  <!-- Title Bottom -->
  <text x="100" y="435" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">SmartVision Traffic Flow</text>
  <text x="100" y="460" font-family="sans-serif" font-size="14" fill="#94a3b8">Real-Time Computer Vision & Edge Vehicle Analytics (YOLOv8 + DeepSORT)</text>
</svg>
