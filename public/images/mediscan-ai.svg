<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Medical Cross & Scan HUD -->
  <circle cx="280" cy="220" r="120" fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="280" cy="220" r="80" fill="url(#heatGrad)" opacity="0.35" filter="blur(8px)" />

  <!-- Chest Scan Ribcage abstraction -->
  <path d="M 280 140 L 280 300" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
  <path d="M 220 180 Q 280 160 340 180" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 210 210 Q 280 190 350 210" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 215 240 Q 280 220 345 240" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 225 270 Q 280 250 335 270" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.7" />

  <!-- Heatmap focal detection box -->
  <rect x="290" y="190" width="55" height="55" rx="8" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" stroke-width="2" />
  <circle cx="317" cy="217" r="4" fill="#f43f5e" />

  <!-- HUD Diagnostics Card Panel -->
  <rect x="470" y="110" width="260" height="230" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <text x="495" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DIAGNOSTIC REPORT</text>
  <text x="495" y="165" font-family="monospace" font-size="11" fill="#06b6d4">MODEL: DenseNet121 + Grad-CAM</text>

  <!-- Progress Bar 1 -->
  <text x="495" y="195" font-family="sans-serif" font-size="11" fill="#94a3b8">Pneumonia Confidence</text>
  <text x="690" y="195" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">97.2%</text>
  <rect x="495" y="202" width="210" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="495" y="202" width="195" height="6" rx="3" fill="#10b981" />

  <!-- Progress Bar 2 -->
  <text x="495" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8">Pleural Effusion</text>
  <text x="700" y="235" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">2.1%</text>
  <rect x="495" y="242" width="210" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="495" y="242" width="15" height="6" rx="3" fill="#f59e0b" />

  <!-- Progress Bar 3 -->
  <text x="495" y="275" font-family="sans-serif" font-size="11" fill="#94a3b8">Infiltration Density</text>
  <text x="700" y="275" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">0.7%</text>
  <rect x="495" y="282" width="210" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="495" y="282" width="8" height="6" rx="3" fill="#38bdf8" />

  <!-- Status Tag -->
  <rect x="495" y="305" width="120" height="22" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" />
  <text x="510" y="320" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">NORMAL CLEAR</text>

  <!-- Title Bottom -->
  <text x="100" y="440" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">MediScan AI</text>
  <text x="100" y="465" font-family="sans-serif" font-size="14" fill="#94a3b8">Deep Learning Chest X-Ray Diagnostic Engine</text>
</svg>
