<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f35;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ecoGrad)"/>

  <!-- Energy chart bars -->
  <rect x="150" y="350" width="60" height="100" fill="#10b981" opacity="0.8"/>
  <rect x="230" y="300" width="60" height="150" fill="#34d399" opacity="0.8"/>
  <rect x="310" y="250" width="60" height="200" fill="#10b981" opacity="0.8"/>
  <rect x="390" y="200" width="60" height="250" fill="#06b6d4" opacity="0.8"/>
  <rect x="470" y="280" width="60" height="170" fill="#34d399" opacity="0.8"/>
  <rect x="550" y="320" width="60" height="130" fill="#10b981" opacity="0.8"/>

  <!-- Grid lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.2">
    <line x1="100" y1="450" x2="700" y2="450"/>
    <line x1="100" y1="400" x2="700" y2="400"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="250" x2="700" y2="250"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
  </g>

  <!-- Axis -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#06b6d4" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="450" stroke="#06b6d4" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="540" font-size="32" font-weight="bold" fill="#10b981" text-anchor="middle">EcoShakti</text>
  <text x="400" y="570" font-size="16" fill="#94a3b8" text-anchor="middle">Renewable Energy Dashboard</text>
</svg>