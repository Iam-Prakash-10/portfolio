<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ragBg)" />

  <!-- Node network connection lines -->
  <g stroke="rgba(139,92,246,0.3)" stroke-width="2">
    <line x1="200" y1="180" x2="380" y2="230" />
    <line x1="200" y1="280" x2="380" y2="230" />
    <line x1="380" y1="230" x2="560" y2="170" />
    <line x1="380" y1="230" x2="560" y2="290" />
    <line x1="560" y1="170" x2="700" y2="230" />
    <line x1="560" y1="290" x2="700" y2="230" />
  </g>

  <!-- Document Nodes Left -->
  <rect x="110" y="145" width="90" height="65" rx="10" fill="rgba(30,41,59,0.8)" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="130" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PDF Report</text>
  <text x="130" y="193" font-family="monospace" font-size="9" fill="#06b6d4">1,450 chunks</text>

  <rect x="110" y="245" width="90" height="65" rx="10" fill="rgba(30,41,59,0.8)" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="130" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">SEC Filing</text>
  <text x="130" y="293" font-family="monospace" font-size="9" fill="#06b6d4">3,890 chunks</text>

  <!-- Vector Database Center -->
  <circle cx="380" cy="230" r="45" fill="rgba(139,92,246,0.2)" stroke="#a855f7" stroke-width="2" />
  <circle cx="380" cy="230" r="30" fill="rgba(6,182,212,0.3)" />
  <text x="355" y="225" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Qdrant</text>
  <text x="345" y="243" font-family="monospace" font-size="9" fill="#38bdf8">Vector DB</text>

  <!-- Re-ranking & LLM Agent -->
  <rect x="520" y="135" width="100" height="65" rx="10" fill="rgba(30,41,59,0.8)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="535" y="165" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">BM25 + Dense</text>
  <text x="535" y="183" font-family="monospace" font-size="9" fill="#10b981">Hybrid Rerank</text>

  <rect x="520" y="255" width="100" height="65" rx="10" fill="rgba(30,41,59,0.8)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="535" y="285" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Claude Agent</text>
  <text x="535" y="303" font-family="monospace" font-size="9" fill="#ec4899">Tool Calling</text>

  <!-- Output Node -->
  <circle cx="700" cy="230" r="35" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2" />
  <text x="675" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">Synthesis</text>

  <!-- Title Bottom -->
  <text x="100" y="430" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Nexus RAG Multi-Agent Engine</text>
  <text x="100" y="455" font-family="sans-serif" font-size="14" fill="#a5b4fc">Autonomous Document Synthesis & Hybrid Vector Search</text>
</svg>
