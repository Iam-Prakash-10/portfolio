  <!-- Document lines -->
  <line x1="200" y1="130" x2="600" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="170" x2="600" y2="170" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="210" x2="500" y2="210" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="240" x2="550" y2="240" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="270" x2="520" y2="270" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="300" x2="560" y2="300" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="330" x2="500" y2="330" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="360" x2="540" y2="360" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
