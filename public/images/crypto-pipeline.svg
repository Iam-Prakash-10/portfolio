<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cryptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cryptoBg)" />

  <!-- Candlestick chart elements -->
  <g opacity="0.85">
    <!-- Green Candles -->
    <line x1="160" y1="180" x2="160" y2="290" stroke="#10b981" stroke-width="2" />
    <rect x="150" y="200" width="20" height="70" fill="#10b981" rx="2" />

    <line x1="220" y1="160" x2="220" y2="280" stroke="#10b981" stroke-width="2" />
    <rect x="210" y="175" width="20" height="85" fill="#10b981" rx="2" />

    <!-- Red Candles -->
    <line x1="280" y1="150" x2="280" y2="270" stroke="#f43f5e" stroke-width="2" />
    <rect x="270" y="180" width="20" height="60" fill="#f43f5e" rx="2" />

    <!-- Green Big Candle -->
    <line x1="340" y1="110" x2="340" y2="260" stroke="#10b981" stroke-width="2" />
    <rect x="330" y="130" width="20" height="110" fill="#10b981" rx="2" />

    <line x1="400" y1="90" x2="400" y2="230" stroke="#10b981" stroke-width="2" />
    <rect x="390" y="110" width="20" height="90" fill="#10b981" rx="2" />
  </g>

  <!-- Sentiment Trend Line -->
  <path d="M 120 280 Q 220 260 300 210 T 420 120 T 520 100" fill="none" stroke="#06b6d4" stroke-width="3.5" />
  <circle cx="520" cy="100" r="6" fill="#06b6d4" />

  <!-- Streaming Pipeline Stats Panel -->
  <rect x="520" y="150" width="220" height="170" rx="14" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="540" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">STREAM TELEMETRY</text>
  <text x="540" y="205" font-family="monospace" font-size="11" fill="#10b981">Kafka Throughput: 12k msg/s</text>
  <text x="540" y="230" font-family="monospace" font-size="11" fill="#06b6d4">Sentiment Score: +0.78 (Bullish)</text>
  <text x="540" y="255" font-family="monospace" font-size="11" fill="#f59e0b">Volatility Index: 18.4</text>
  <text x="540" y="280" font-family="monospace" font-size="11" fill="#a855f7">Latency: 28ms</text>

  <!-- Title Bottom -->
  <text x="100" y="435" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">FinStream & Sentiment Engine</text>
  <text x="100" y="460" font-family="sans-serif" font-size="14" fill="#6ee7b7">Real-Time Crypto/Stock Sentiment & High-Throughput Kafka Stream Pipeline</text>
</svg>
