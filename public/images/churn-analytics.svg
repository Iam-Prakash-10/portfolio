<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="churnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#311042;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#churnBg)" />

  <!-- Donut Chart -->
  <circle cx="250" cy="220" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="28" />
  <circle cx="250" cy="220" r="90" fill="none" stroke="#06b6d4" stroke-width="28" stroke-dasharray="380 565" stroke-linecap="round" />
  <circle cx="250" cy="220" r="90" fill="none" stroke="#f43f5e" stroke-width="28" stroke-dasharray="140 565" stroke-dashoffset="-380" stroke-linecap="round" />

  <text x="250" y="215" font-family="sans-serif" font-size="28" font-weight="extrabold" fill="#ffffff" text-anchor="middle">89.4%</text>
  <text x="250" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Retention Rate</text>

  <!-- SHAP Feature Importance Bars -->
  <rect x="440" y="110" width="290" height="220" rx="14" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <text x="460" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SHAP FEATURE IMPORTANCE</text>

  <text x="460" y="170" font-family="monospace" font-size="11" fill="#94a3b8">Support Tickets (>3)</text>
  <rect x="460" y="178" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="460" y="178" width="180" height="8" rx="4" fill="#f43f5e" />

  <text x="460" y="210" font-family="monospace" font-size="11" fill="#94a3b8">Session Frequency drop</text>
  <rect x="460" y="218" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="460" y="218" width="140" height="8" rx="4" fill="#f59e0b" />

  <text x="460" y="250" font-family="monospace" font-size="11" fill="#94a3b8">Payment Renewal Delay</text>
  <rect x="460" y="258" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="460" y="258" width="110" height="8" rx="4" fill="#06b6d4" />

  <text x="460" y="290" font-family="monospace" font-size="11" fill="#94a3b8">Feature Usage Depth</text>
