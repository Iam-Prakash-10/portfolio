  <rect x="460" y="298" width="70" height="8" rx="4" fill="#10b981" />

  <!-- Title Bottom -->
  <text x="100" y="435" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">ChurnScope AI</text>
  <text x="100" y="460" font-family="sans-serif" font-size="14" fill="#f472b6">Predictive Customer Churn Intelligence & SHAP Explainability Dashboard</text>
